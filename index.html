<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="robots" content="index,follow" />
    <meta name="description" content="免费易用的pixiv图片解析下载工具" />
    <meta name="keywords" content="pixiv,图片解析,图片下载" />
    <meta property="og:title" content="pixiv图片下载" />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://maximnightingale.github.io/pixiv-image-get/">
    <meta property="og:description" content="免费易用的pixiv图片解析下载工具" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' https: data:; font-src 'self' https://fonts.gstatic.com; connect-src https://i.muxmus.com https://pixiv.shojo.cn; base-uri 'self'; form-action 'self'">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
    <title>Pixiv 图片解析</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
  </head>
  <body>
    <div class="container">
      <header>
        <h1><em>Pixiv</em> <span style="font-style:normal;font-weight:400;">图片解析</span></h1>
      </header>
      <div class="input-wrap">
        <input
          type="search"
          class="input-field"
          id="pixivUrl"
          placeholder="输入作品链接或 PID"
          maxlength="500"
          aria-label="Pixiv 作品链接或 PID"
          autocomplete="off"
          spellcheck="false"
        />
        <button id="submitBtn">解析</button>
      </div>
      <div class="proxy-row">
        <div class="proxy-selector" role="radiogroup" aria-label="选择代理">
          <button class="proxy-btn active" data-index="0" role="radio" aria-checked="true">代理一</button>
          <button class="proxy-btn" data-index="1" role="radio" aria-checked="false">代理二</button>
        </div>
      </div>
      <div id="result"></div>
    </div>
    <div id="imageModal">
      <button class="close-modal-btn" id="closeModal" aria-label="关闭">×</button>
      <div class="modal-img-container" id="modalImgContainer">
        <img id="modalOriginalImg" alt="原图" />
      </div>
      <div class="modal-bar">
        <button id="prevImgBtn" class="modal-control-btn" disabled aria-label="上一张">‹</button>
        <button id="zoomInBtn"  class="modal-control-btn" aria-label="放大">+</button>
        <div class="img-size-info" id="imgSizeInfo">— × —</div>
        <button id="zoomOutBtn" class="modal-control-btn" aria-label="缩小">−</button>
        <button id="nextImgBtn" class="modal-control-btn" disabled aria-label="下一张">›</button>
      </div>
    </div>
    <div id="toast"></div>
</body>
</html>
